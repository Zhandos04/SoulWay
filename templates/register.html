{% extends "base.html" %}
{% block title %}Регистрация — SoulWay{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <span class="auth-logo">🌿</span>
        <h1>Создать аккаунт</h1>
        <p class="subtitle">Начните путь самопознания</p>

        <div id="errorMsg" class="auth-error" style="display:none;"></div>

        <div class="form-group">
            <label>Имя пользователя</label>
            <input type="text" id="username" class="form-control" placeholder="Придумайте логин">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="password" class="form-control" placeholder="Минимум 6 символов">
        </div>
        <div class="form-group" style="margin-bottom:2rem;">
            <label>Повторите пароль</label>
            <input type="password" id="password2" class="form-control" placeholder="Повторите пароль">
        </div>

        <button class="btn btn-primary btn-large btn-full" onclick="doRegister()">Зарегистрироваться</button>
        <p class="auth-switch">Уже есть аккаунт? <a href="/login">Войти</a></p>
    </div>
</div>

<script>
async function doRegister() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (password !== password2) {
        const err = document.getElementById('errorMsg');
        err.textContent = 'Пароли не совпадают';
        err.style.display = 'block';
        return;
    }

    const res = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (data.success) {
        window.location.href = '/';
    } else {
        const err = document.getElementById('errorMsg');
        err.textContent = data.error;
        err.style.display = 'block';
    }
}
</script>
{% endblock %}
